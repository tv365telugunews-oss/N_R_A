name: API Verify

on:
  push:
    branches: [ main, master ]
    paths:
      - 'server.js'
      - 'scripts/verify-deploy.cjs'
      - '.github/workflows/api-verify.yml'
      - 'package.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed API endpoints
        run: npm run verify:deploy

      - name: Verify /api/news compatibility route
        run: |
          node -e "(async () => { const res = await fetch('https://news-robo-api.onrender.com/api/news?limit=1&page=1'); if (!res.ok) throw new Error('status ' + res.status); const body = await res.json(); if (!Array.isArray(body.data)) throw new Error('Missing data[]'); console.log('API alias check PASS'); })().catch((e) => { console.error(e.message); process.exit(1); });"
