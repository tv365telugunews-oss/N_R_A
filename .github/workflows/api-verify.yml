name: API Verify

on:
  push:
    branches: [ main, master ]
    paths:
      - 'server.js'
      - 'scripts/verify-deploy.cjs'
      - '.github/workflows/api-verify.yml'
      - 'package.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed API endpoints
        run: npm run verify:deploy
